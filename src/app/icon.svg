<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="25%" stop-color="#DFC06A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="75%" stop-color="#E8D0A0"/>
      <stop offset="100%" stop-color="#9C7A3C"/>
    </linearGradient>

    <!-- Warm Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A3423"/>
      <stop offset="70%" stop-color="#2D1C12"/>
      <stop offset="100%" stop-color="#1A0E08"/>
    </radialGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Outer Thick Gold Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Delicate Beaded / Dotted Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#DFC06A" stroke-width="2.5" stroke-dasharray="4 8" opacity="0.8"/>

  <!-- Inner Fine Gold Ring -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Decorative Cardinal Sparkles -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Top Sparkle -->
    <path d="M 256 62 Q 256 78 262 84 Q 256 90 256 106 Q 256 90 250 84 Q 256 78 256 62 Z"/>
    <!-- Bottom Sparkle -->
    <path d="M 256 406 Q 256 422 262 428 Q 256 434 256 450 Q 256 434 250 428 Q 256 422 256 406 Z"/>
    <!-- Left Dot Accent -->
    <circle cx="68" cy="256" r="4.5"/>
    <!-- Right Dot Accent -->
    <circle cx="444" cy="256" r="4.5"/>
  </g>

  <!-- Monogram A & H -->
  <!-- Serif Monogram Letter A -->
  <text x="175" y="285"
        font-family="'Cinzel', 'Cormorant Garamond', 'Times New Roman', 'Playfair Display', serif"
        font-size="140"
        font-weight="700"
        fill="url(#goldGrad)"
        text-anchor="middle"
        letter-spacing="2">A</text>

  <!-- Elegant Ampersand (&) / Sparkle -->
  <text x="256" y="278"
        font-family="'Cormorant Garamond', 'Baskerville', 'Georgia', serif"
        font-style="italic"
        font-size="78"
        font-weight="400"
        fill="#FDE8DA"
        text-anchor="middle"
        opacity="0.95">&amp;</text>

  <!-- Serif Monogram Letter H -->
  <text x="337" y="285"
        font-family="'Cinzel', 'Cormorant Garamond', 'Times New Roman', 'Playfair Display', serif"
        font-size="140"
        font-weight="700"
        fill="url(#goldGrad)"
        text-anchor="middle"
        letter-spacing="2">H</text>

  <!-- Underline Monogram Flourish -->
  <path d="M 170 326 C 210 336 302 336 342 326" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="256" cy="331" r="3.5" fill="url(#goldGrad)"/>

  <!-- Subtitle Text -->
  <text x="256" y="362"
        font-family="'Montserrat', 'Arial', sans-serif"
        font-size="24"
        font-weight="600"
        letter-spacing="10"
        fill="#E8D0A0"
        text-anchor="middle"
        opacity="0.9">FOREVER</text>
</svg>